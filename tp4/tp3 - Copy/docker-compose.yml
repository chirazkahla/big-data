version: "3.9"

services:
  cont1:
    image: chiraz230/big-data-tp3:latest
    container_name: cont1
    ports:
      - "8081:80"
    networks:
      - mynetwork

  cont2:
    image: chiraz230/big-data-tp3:latest
    container_name: cont2
    ports:
      - "8082:80"
    networks:
      - mynetwork

  cont3:
    image: chiraz230/big-data-tp3:latest
    container_name: cont3
    ports:
      - "8083:80"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge
