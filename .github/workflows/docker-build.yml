name: Build, Push, and Test Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'tp3/**'   # سيعمل فقط إذا تم تعديل ملفات داخل مجلد tp3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 🧩 1. تحميل الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🏗️ 2. إعداد Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 3. تسجيل الدخول إلى Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: chiraz230
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🏗️ 4. بناء الصورة ورفعها إلى Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./tp3        # 📂 مكان وجود Dockerfile وملف Python
          push: true
          tags: chiraz230/big-data-tp3:latest

      # 🧪 5. اختبار الصورة بعد رفعها بتشغيل ملف Python
      - name: Test Docker container by running Python script
        run: |
          docker run --rm chiraz230/big-data-tp3:latest python3 /app/test_script.py
